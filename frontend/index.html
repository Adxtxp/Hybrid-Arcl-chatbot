<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ARCL Rules Assistant</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Phase 3: Gatekeeper UI — blocks chat input until a league is chosen -->
  <div id="gatekeeper" class="overlay">
    <div class="gatekeeper-card">
      <div class="brand-mark">🏏</div>
      <h1>ARCL Rules Assistant</h1>
      <p>Which league are you asking about?</p>
      <div class="league-buttons">
        <button class="league-btn" data-league="Mens">Men's</button>
        <button class="league-btn" data-league="Womens">Women's</button>
        <button class="league-btn" data-league="Youth">Youth</button>
      </div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="app-header">
      <div class="header-title">
        <span class="brand-mark brand-mark-sm">🏏</span> ARCL Rules Assistant
        <span id="current-league-badge" class="league-badge"></span>
      </div>
      <div class="header-actions">
        <button id="nrr-btn" title="Net Run Rate calculator">NRR Calculator</button>
        <button id="change-league-btn" title="Pick a different league">Change League</button>
        <button id="human-support-btn" title="Talk to a league admin">Contact Human Support</button>
      </div>
    </header>

    <main id="messages" class="messages"></main>

    <!-- Decision-tree chips render here when the API returns options; hidden otherwise -->
    <div id="decision-chips" class="decision-chips hidden"></div>

    <form id="chat-form" class="chat-form">
      <input id="chat-input" type="text" placeholder="Ask a rules question…" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <!-- Phase 3: NRR micro-widget — pure client-side, no backend call needed -->
  <div id="nrr-modal" class="overlay hidden">
    <div class="nrr-card">
      <h2>Net Run Rate Calculator</h2>
      <p class="nrr-formula">NRR = (Runs Scored ÷ Overs Faced) − (Runs Conceded ÷ Overs Bowled)</p>

      <fieldset>
        <legend>Your team</legend>
        <label>Runs scored <input type="number" id="nrr-runs-for" min="0" step="1" /></label>
        <label>Overs faced <input type="number" id="nrr-overs-for" min="0" step="0.1" placeholder="e.g. 15.3 overs = 15.5" /></label>
      </fieldset>

      <fieldset>
        <legend>Opponent</legend>
        <label>Runs conceded <input type="number" id="nrr-runs-against" min="0" step="1" /></label>
        <label>Overs bowled <input type="number" id="nrr-overs-against" min="0" step="0.1" /></label>
      </fieldset>

      <p class="nrr-note">
        Enter overs as balls-into-the-over ÷ 6, e.g. 15 overs 3 balls = 15 + 3/6 = 15.5 (not 15.3).
      </p>

      <div class="nrr-result" id="nrr-result">—</div>

      <button id="nrr-close-btn">Close</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
